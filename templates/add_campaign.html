<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Create Campaign - Xeno CRM</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css?v=1.1">
  </head>
  <body>
    <nav class="navbar">
      <a href="/" class="navbar-brand">Xeno CRM</a>
      <div class="nav-links">
        <a href="/" class="nav-link">Dashboard</a>
        <a href="/customers" class="nav-link">Customers</a>
        <a href="/orders" class="nav-link">Orders</a>
        <a href="/segments" class="nav-link">Segments</a>
        <a href="/campaigns" class="nav-link active">Campaigns</a>
        <a href="/analytics" class="nav-link">Analytics</a>
        <a href="/ai-segment" class="nav-link">AI Segment</a>
      </div>
    </nav>

    <div class="container">
      <div class="header-section">
        <h1>Create Campaign</h1>
      </div>
      
      <div class="card">
        <form method="post" action="/campaigns/create">
          <div class="form-group">
            <label for="name">Campaign Name</label>
            <input type="text" id="name" name="name" placeholder="e.g. Summer Discount" required />
          </div>

          <div class="form-group">
            <label for="audience">Target Audience</label>
            <input type="text" id="audience" name="audience" placeholder="e.g. High Value Customers" required />
          </div>

          <div class="form-group">
            <label for="channel">Channel</label>
            <select id="channel" name="channel" required>
              <option value="" disabled selected>Select communication channel...</option>
              <option value="Email">Email</option>
              <option value="SMS">SMS</option>
              <option value="WhatsApp">WhatsApp</option>
            </select>
          </div>

          <div class="form-group" style="background-color: rgba(59, 130, 246, 0.04); border: 1px dashed var(--border-color); padding: 1.25rem; border-radius: 8px; margin-bottom: 1.5rem;">
            <label for="ai_prompt" style="color: #60a5fa; font-weight: 600;">Generate Message with Gemini</label>
            <div style="display: flex; gap: 0.75rem; margin-top: 0.25rem;">
              <input type="text" id="ai_prompt" placeholder="e.g. Create a win-back campaign" style="flex: 1;" />
              <button type="button" id="btn-generate-ai" class="btn" style="width: auto; padding: 0.75rem 1.25rem; white-space: nowrap;">Generate</button>
            </div>
          </div>

          <div class="form-group">
            <label for="message">Message</label>
            <textarea id="message" name="message" placeholder="e.g. Get 20% Off Today!" required></textarea>
          </div>

          <button type="submit" class="btn">Create Campaign</button>
        </form>
      </div>
    </div>

    <script src="/static/js/app.js?v=1.1"></script>
  </body>
</html>
